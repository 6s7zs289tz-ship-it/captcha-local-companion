name: Build optional Windows companion
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test worker and native protocol without loading models
        shell: pwsh
        run: |
          python tests/test-ocr-server.py
          ./scripts/check-native.ps1
      - name: Build self-contained installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: captcha-local-setup-0.1.0
          path: |
            dist/captcha-local-setup-0.1.0.exe
            dist/captcha-local-setup-0.1.0.exe.sha256
          if-no-files-found: error
      - name: Publish first release without replacing an existing version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $TaskTag = 'v0.1.0'
          gh release view $TaskTag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This version is already published. The new build remains an artifact.'
            exit 0
          }
          gh release create $TaskTag dist/captcha-local-setup-0.1.0.exe dist/captcha-local-setup-0.1.0.exe.sha256 --target "$env:GITHUB_SHA" --title 'Local OCR companion 0.1.0' --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }